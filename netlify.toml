[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

# Environment variables (alternative to dashboard)
[build.environment]
  REACT_APP_API_URL = "https://amp-backend-s7o1.onrender.com/api"

# Redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"