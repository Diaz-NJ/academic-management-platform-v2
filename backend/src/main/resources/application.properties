spring.application.name=academic-management-platform

# Profile-based configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Existing database URL stays the same
spring.datasource.url=jdbc:postgresql://dpg-d4hrcaf5r7bs73c2f2g0-a.singapore-postgres.render.com:5432/amp_db_dhqn?user=amp_db_dhqn_user&password=4wmAw9ifFcvPJkY8vMAZPDwZdtTg4GyL&sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver

# ✅ NEW: Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ✅ NEW: Faster connection validation
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000

# Existing JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ✅ NEW: Hibernate Performance Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Server Configuration
server.port=${PORT:8080}

# CORS Configuration
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,https://your-frontend-url.netlify.app}

# ✅ NEW: Enable Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024